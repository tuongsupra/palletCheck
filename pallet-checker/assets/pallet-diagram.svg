<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Sơ đồ pallet 26 cấu kiện</title>
  <desc id="d">Hình cạnh pallet và 4 nhóm cấu kiện: 9 thanh mặt màu xanh dương, 3 gánh màu đỏ, 9 cục gù màu xanh đậm, 5 thanh đáy màu xanh lá.</desc>
  <defs>
    <style>
      .mat{fill:#1e6fd9}.ganh{fill:#d32f2f}.gu{fill:#1b5e20}.day{fill:#43a047}
      .s{stroke:#0b1b2b;stroke-width:1}
      .h{font-size:15px;font-weight:700;fill:#0b1b2b}
      .l{font-size:13px;fill:#0b1b2b}
      .box{fill:#f4f6f8;stroke:#c5ccd3}
    </style>
  </defs>

  <!-- Hình nhìn cạnh (tách lớp) -->
  <text x="180" y="18" text-anchor="middle" class="h">Nhìn cạnh pallet</text>
  <g class="s">
    <g class="mat">
      <rect x="20" y="30" width="24" height="12"/><rect x="57" y="30" width="24" height="12"/>
      <rect x="94" y="30" width="24" height="12"/><rect x="131" y="30" width="24" height="12"/>
      <rect x="168" y="30" width="24" height="12"/><rect x="205" y="30" width="24" height="12"/>
      <rect x="242" y="30" width="24" height="12"/><rect x="279" y="30" width="24" height="12"/>
      <rect x="316" y="30" width="24" height="12"/>
    </g>
    <rect class="ganh" x="20" y="46" width="320" height="12"/>
    <g class="gu">
      <rect x="20" y="62" width="34" height="34"/><rect x="163" y="62" width="34" height="34"/>
      <rect x="306" y="62" width="34" height="34"/>
    </g>
    <rect class="day" x="20" y="100" width="320" height="12"/>
  </g>
  <g class="l">
    <text x="180" y="130" text-anchor="middle">Trên xuống: thanh mặt → gánh → cục gù → thanh đáy</text>
  </g>

  <!-- 4 hình nhìn từ trên của từng nhóm -->
  <!-- Thanh mặt -->
  <rect class="box" x="10" y="145" width="165" height="150" rx="8"/>
  <text x="92" y="166" text-anchor="middle" class="h">Thanh mặt — 9</text>
  <g class="mat s">
    <rect x="22" y="176" width="11" height="108"/><rect x="38" y="176" width="11" height="108"/>
    <rect x="54" y="176" width="11" height="108"/><rect x="70" y="176" width="11" height="108"/>
    <rect x="86" y="176" width="11" height="108"/><rect x="102" y="176" width="11" height="108"/>
    <rect x="118" y="176" width="11" height="108"/><rect x="134" y="176" width="11" height="108"/>
    <rect x="152" y="176" width="11" height="108"/>
  </g>

  <!-- Gánh -->
  <rect class="box" x="185" y="145" width="165" height="150" rx="8"/>
  <text x="267" y="166" text-anchor="middle" class="h">Gánh — 3</text>
  <g class="ganh s">
    <rect x="197" y="178" width="141" height="16"/>
    <rect x="197" y="222" width="141" height="16"/>
    <rect x="197" y="266" width="141" height="16"/>
  </g>

  <!-- Cục gù -->
  <rect class="box" x="10" y="305" width="165" height="150" rx="8"/>
  <text x="92" y="326" text-anchor="middle" class="h">Cục gù — 9</text>
  <g class="gu s">
    <rect x="24" y="336" width="24" height="24"/><rect x="80" y="336" width="24" height="24"/><rect x="137" y="336" width="24" height="24"/>
    <rect x="24" y="378" width="24" height="24"/><rect x="80" y="378" width="24" height="24"/><rect x="137" y="378" width="24" height="24"/>
    <rect x="24" y="420" width="24" height="24"/><rect x="80" y="420" width="24" height="24"/><rect x="137" y="420" width="24" height="24"/>
  </g>

  <!-- Thanh đáy -->
  <rect class="box" x="185" y="305" width="165" height="150" rx="8"/>
  <text x="267" y="326" text-anchor="middle" class="h">Thanh đáy — 5</text>
  <g class="day s">
    <rect x="197" y="336" width="16" height="108"/><rect x="228" y="336" width="16" height="108"/>
    <rect x="259" y="336" width="16" height="108"/><rect x="290" y="336" width="16" height="108"/>
    <rect x="322" y="336" width="16" height="108"/>
  </g>
</svg>
